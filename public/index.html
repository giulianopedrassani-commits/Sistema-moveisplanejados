<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Móveis Planejados - Login</title>
    <!-- Fonte Inter do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Folha de Estilo Principal -->
    <link rel="stylesheet" href="./css/style.css">
    
    <style>
        /* Estilos Específicos do Login */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 3rem 2rem;
            animation: fadeIn 0.6s ease-out forwards;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-logo {
            font-size: 2rem;
            font-weight: 700;
            background: var(--gradient-neon);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .login-form .btn-primary {
            width: 100%;
            margin-top: 1rem;
            padding: 0.85rem;
            font-size: 1.05rem;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="login-page">

    <div class="glass-panel login-container">
        
        <div class="login-header">
            <h1 class="login-logo" id="brand-name">Loja de Móveis Planejados</h1>
            <p class="login-subtitle">Sistema de Gestão Profissional</p>
        </div>

        <!-- Área para mensagens de erro/sucesso -->
        <div id="alertBox" class="alert"></div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" class="form-input" placeholder="admin@loja.com" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" id="senha" class="form-input" placeholder="••••••••" required autocomplete="off">
            </div>

            <div class="form-group" style="flex-direction: row; align-items: center; gap: 0.5rem; margin-top: -0.5rem; margin-bottom: 2rem;">
                <input type="checkbox" id="rememberMe" style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent-primary);">
                <label for="rememberMe" class="form-label" style="cursor: pointer; user-select: none;">Lembrar-me</label>
            </div>

            <button type="submit" id="btnSubmit" class="btn-primary">
                <span id="btnText">Entrar no Sistema</span>
                <div id="btnLoading" class="loading-spinner"></div>
            </button>
        </form>

    </div>

    <!-- Script de Integração API -->
    <script src="./js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('@DesignStudio:rememberEmail');
            const savedPass = localStorage.getItem('@DesignStudio:rememberPass');
            
            if (savedEmail && savedPass) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('senha').value = savedPass;
                document.getElementById('rememberMe').checked = true;
            }

            // Limpeza imediata ao desmarcar (Experiência do Usuário)
            document.getElementById('rememberMe').addEventListener('change', function() {
                if (!this.checked) {
                    localStorage.removeItem('@DesignStudio:rememberEmail');
                    localStorage.removeItem('@DesignStudio:rememberPass');
                    // Limpa os campos também para dar feedback visual de que não está mais "salvo"
                    document.getElementById('email').value = '';
                    document.getElementById('senha').value = '';
                }
            });
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            const alertBox = document.getElementById('alertBox');
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const btnSubmit = document.getElementById('btnSubmit');

            // Reset UI
            alertBox.className = 'alert';
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline-block';
            btnSubmit.disabled = true;

            try {
                // Chama nossa API feita anteriormente
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || data.erro || 'Falha ao autenticar.');
                }

                // Sucesso: Salvar JWT
                localStorage.setItem('@DesignStudio:token', data.token);

                // Lógica Lembrar-me
                if (rememberMe) {
                    localStorage.setItem('@DesignStudio:rememberEmail', email);
                    localStorage.setItem('@DesignStudio:rememberPass', senha);
                } else {
                    localStorage.removeItem('@DesignStudio:rememberEmail');
                    localStorage.removeItem('@DesignStudio:rememberPass');
                }
                
                alertBox.textContent = 'Login aprovado! Redirecionando...';
                alertBox.className = 'alert success';
                
                // Animação e Redirecionamento
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 800);

            } catch (error) {
                // Erro
                alertBox.textContent = error.message;
                alertBox.className = 'alert error';
                btnText.style.display = 'inline-block';
                btnLoading.style.display = 'none';
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
